# ── Tools ──────────────────────────────────────────────────────────────────────
# Blank-slate baseline + what Infiny needs. Terminal + File do most OS work
# (per Hermes philosophy: prefer skills/terminal over new core tools).
# Structured vision + cursor control come from the infiny MCP server below.
tools:
  terminal:
    enabled: true
    backend: local          # run commands directly on the host OS
  file:
    enabled: true
  web:
    enabled: true           # SearXNG/Firecrawl can be wired later
  vision:
    enabled: true
  memory:
    enabled: true

# ── Web: search and page reading ──────────────────────────────────────────────
# Split by capability on purpose:
#   search  -> searxng       — our SearXNG inside the container, no keys;
#   extract -> infiny-render — our Playwright/Chromium, also inside.
#
# Why not an MCP server, as it used to be. It was called `web`, and Hermes HAS a
# built-in toolset by that name. The tools registered
# (mcp__web__web_search), but the platform resolver answered the name `web` with
# the built-in toolset, which is dead without a provider — the check_fn gate cut
# it silently. The result: 14 of 33 tools reached the model, and search was not
# among them AT ALL. The symptom, "the agent lies about search", lasted two
# weeks. Diagnosed 2026-08-13.
#
# SEARXNG_URL lives in ~/.hermes/.env (written by ensure_gateway_env() and
# wsl/infiny-start.sh) rather than here: without it the built-in search goes
# invisible again, so it travels the same path as API_SERVER_KEY.
plugins:
  enabled:
    - web/infiny-render     # ~/.hermes/plugins/web/infiny-render — opt-in by Hermes design

web:
  search_backend: searxng
  extract_backend: infiny-render

# The Box has no MCP servers. The infiny server (vision and cursor) belongs to
# Infiny OS: it exposes see_screen and capture_screenshot, and the Box has no
# display, no grim and no ydotool. That is worse than a plain breakage: SOUL.md
# tells the model "you have no vision" while the tool list would say otherwise —
# and the model believes the list, not the prompt. Observed live 2026-08-02.

# ── Self-improvement ───────────────────────────────────────────────────────────
self_improvement:
  enabled: true

# ── Approvals ───────────────────────────────────────────────────────────────────
# manual (default): only commands matching Hermes' dangerous-pattern list need
# your approval (rm -rf, DROP TABLE, git reset --hard, dd, mkfs, etc). Read-only
# commands — free, date, lscpu, df, uname, hostname, lspci — run WITHOUT asking.
# This is exactly what makes "what's my system / how much RAM / what time is it"
# work with zero friction: they are not on the dangerous list.
approvals:
  mode: manual
  timeout: 60
  # Extra safety net specific to Infiny being a full OS agent (not just a dev
  # tool) — these are blocked even under --yolo, on top of Hermes' own hardline
  # blocklist (fork bombs, filesystem wipes, direct block-device writes).
  deny:
    - "mkfs*"
    - "dd if=* of=/dev/sd*"
    - "dd if=* of=/dev/nvme*"
    - "* > /dev/sd*"
    - "shred*/dev/*"
    - "*:(){ :|:& };:*"        # fork bomb variants beyond the built-in blocklist

# ── Security ───────────────────────────────────────────────────────────────────
# tirith is Hermes' pre-exec scanner (the binary sits in ~/.hermes/bin/tirith
# and enables itself when found). It is disabled here DELIBERATELY, and here is
# why.
#
# One of its rules is "Confusable Unicode characters": Cyrillic or Greek next to
# ASCII is treated as an attempted homoglyph attack. For anyone working in a
# non-Latin language that fires on practically EVERY command — `echo "Готово"`
# or a file with a Russian name is enough. Observed live 2026-08-22: the request
# "create a directory and a file with some text" ran straight into [HIGH]
# Confusable Unicode. The Box supports Russian as a first-class interface
# language (see core/i18n.py), and a rule that conflicts with the language of
# the product cannot stay in it.
#
# This does NOT loosen dangerous commands: the whole approvals mechanism above
# remains — Hermes' own detector plus our deny list, which is stricter than
# tirith. If you want the scanner (an English-only setup, say), set this true.
security:
  tirith_enabled: false

# ── Soul (identity) ────────────────────────────────────────────────────────────
# The system prompt / persona. Full text in SOUL.md alongside this file.
soul:
  file: "SOUL.md"
