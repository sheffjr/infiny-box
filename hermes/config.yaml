# Infiny OS — Hermes Agent configuration
# Hermes is the BRAIN of Infiny. It provides memory, skills, tool-calling,
# self-improvement and an OpenAI-compatible endpoint the UI talks to.
#
# This file is installed to ~/.hermes/config.yaml (user 'user') at build time.
# Secrets (API keys for cloud fallback) go in ~/.hermes/.env, never here.

# ── Model provider ─────────────────────────────────────────────────────────────
# DELIBERATELY EMPTY. Phase 1 ships no model; the user attaches their own with
# `infiny --setup`. The wizard writes default, base_url and api_key here.
# provider: "custom" — the ollama/vllm/llamacpp aliases all map onto it anyway.
#
# This used to hold the development machine's real LAN address, and it shipped
# inside the image: on first run the user saw "Currently connected: qwen3.5:4b"
# pointing at somebody else's machine and concluded everything was already set
# up. Nothing of ours belongs here.
#
# Which model to suggest is in README.
# qwen3-vl:4b is not recommended: the only model we tested that leaked its
# system prompt to an injection, and 25x slower to first token.
model:
  provider: "custom"

# ── Agent ──────────────────────────────────────────────────────────────────────
# reasoning_effort was the most expensive mistake of Phase 1. It said "none",
# because thinking had once produced loops on a weak model. The price was the
# agent's ability to act at all: on 2026-08-22 a run of four agentic tasks
# across two models showed that "none" breaks BOTH, differently and invisibly:
#   qwen3.5:9b  — writes out a plan and ENDS its turn, having done nothing;
#   gemma4:12b  — emits the tool call as `call:skill_view(...)`, while Ollama's
#                 gemma4 parser expects JSON, so the call is unreadable and the
#                 answer comes back empty.
# With "low", qwen completed a self-extension for the first time (found,
# installed qrencode, generated a file, verified it), and gemma's parse errors
# disappeared entirely.
#
# Hermes levels: none|minimal|low|medium|high|xhigh|max|ultra (empty = the
# provider default). Changeable at runtime: `/reasoning <level>` in the CLI
# writes here and restarts the gateway. Above low is not always sensible on
# small models: latency grows, and on a 4b the loop risk returns.
agent:
  reasoning_effort: "low"

# ── Server / gateway ───────────────────────────────────────────────────────────
# The CLI talks to the Hermes gateway (`hermes gateway run`) on :8642 with
# Bearer auth. The port and whether the gateway runs at all are set through
# ~/.hermes/.env:
#   API_SERVER_ENABLED=true
#   API_SERVER_KEY=<secret>   <- the key cli.py authenticates with
# The key is NOT stored here (secrets live in .env only).

# ── Memory (holographic, built-in) ─────────────────────────────────────────────
# MEMORY.md + USER.md injected into prompt; FTS5 session search; background review.
memory:
  provider: builtin
  capture: true             # automatically learn durable facts
  nudge_interval: 8         # background memory review every N turns

# ── Skills (procedural memory + OS capabilities) ───────────────────────────────
# Infiny's OS skills live in ~/.hermes/skills/. They are the distro's added value:
# Hyprland control, package management, network, self-healing, super-context.
skills:
  enabled: true
  auto_create: true         # let Hermes distill repeated tasks into new skills

  # Curated skill set. The vanilla Hermes catalog ships ~83 skills (Suno,
  # TouchDesigner, Polymarket, Notion, Airtable, ...) that are irrelevant to an
  # AI-first Linux OS. Left enabled they (a) burn ~2.6k tokens of every system
  # prompt and (b) drown Infiny's own skills, so a small local model picks the
  # wrong one or none at all. Re-enable any of these by deleting its line.
  # computer-use is disabled because it duplicates our desktop-control skill.
  disabled:
    - computer-use
    - airtable
    - architecture-diagram
    - arxiv
    - ascii-art
    - ascii-video
    - audiocraft-audio-generation
    - baoyu-infographic
