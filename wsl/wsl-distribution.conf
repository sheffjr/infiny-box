[oobe]
command="/etc/oobe.sh"
defaultUid=1000
defaultName="Infiny"

[shortcut]
enabled=true
# icon= is deliberately unset: there is no icon file in the repository, and
# pointing at a path that does not exist gives a silently broken shortcut.
# Without the key, WSL uses a default icon. Restore this once a real .ico
# exists.

[windowsterminal]
enabled=true
ProfileTemplate="/opt/infiny/terminal-profile.json"
