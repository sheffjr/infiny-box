[boot]
systemd=true
command="/opt/infiny/first-run.sh"

[user]
# root, not user. SOUL.md promises the agent full rights inside the Box, and
# while it ran as `user` that was a lie: the first package install hit a
# permission denial and the agent abandoned the task. The Box's isolation is the
# container itself, not a user/root boundary inside it.
default=root

[automount]
# Host drives are NOT mounted. Without this section WSL attaches C: and D: under
# /mnt by default, and the "sandbox" can see every file the user owns.
#
# That contradicted the product outright: README says "a container you can
# afford to break", SOUL.md tells the agent "outside the Box you have no hands"
# — and both were false. The agent runs as root, in yolo mode, without
# confirmations; nothing whatsoever stood between it and the real disk.
#
# Sharing a folder deliberately is one command from inside the Box:
#     mkdir -p /mnt/d && mount -t drvfs D: /mnt/d
# Which is how it should be: reaching outside is an act a person takes, not a
# state they inherit.
enabled=false

[network]
# Without this the Box inherits the Windows machine's name, so the prompt reads
# root@<whatever-the-laptop-is-called>. Two reasons that is wrong: the banner
# and the social card both show `root@infiny`, promising something the product
# did not deliver, and screenshots differ for every user for no reason.
#
# WSL regenerates /etc/hosts from this, so 127.0.1.1 follows the new name and
# anything resolving the hostname keeps working.
hostname=infiny
generateHosts=true
generateResolvConf=true

[interop]
# Running Windows programs from inside the Box is DISABLED.
#
# Interop is the mechanism by which Linux executes the host's .exe files. While
# it was on, isolation rested solely on no drives being mounted: the agent runs
# as root, and root can mount C: itself — and then run anything on it as the
# Windows user. The way out of the sandbox existed; it just took two commands
# instead of one.
#
# We cannot close mounting itself and do not pretend to: drvfs lives in the WSL
# kernel, and root inside its own namespace is entitled to mount — that is what
# root means. Taking it away means taking away root, and root is what the
# product promises the agent ("install what you need, break things and fix
# them"). So we cut not access to files but the ability to EXECUTE: the
# difference between "read your files" and "ran something as you" is the
# difference between a nuisance and a catastrophe.
#
# The cost: commands like `explorer.exe .` and `powershell.exe` stop working
# from inside. A Phase 1 user does not need them — the Box is a terminal with an
# agent, not a bridge into Windows.
#
# To bring it back: enabled=true here, and then fix the "Your files stay yours"
# section in README, which leans on this restriction.
enabled=false
appendWindowsPath=false
