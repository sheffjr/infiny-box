<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-labelledby="t d">
<title id="t">What crosses the boundary and what does not</title><desc id="d">Your machine on the left holds your files, your session and your model server. The Box on the right holds a root Linux with the agent, search and a browser. Nothing of yours is mounted and the Box cannot run programs on your side; the only crossing is the Box calling the model endpoint you pointed it at.</desc>
<style>
  text { font-family: ui-monospace,"Cascadia Mono","SFMono-Regular","Menlo",Consolas,"DejaVu Sans Mono",monospace; }
  .fg { fill: #1F2328; } .tx { fill: #1F2328; }
  .mu { fill: #656D76; } .dm { fill: #8C959F; }
  .ac { fill: #0969DA; } .bl { fill: #0969DA; }
  .gr { fill: #1A7F37; } .rd { fill: #CF222E; }
  .b { font-weight: 700; }
</style>
<rect x="0" y="0" width="1280" height="560" fill="#FFFFFF"/>
<rect x="48" y="92" width="400" height="384" rx="12" fill="none" stroke="#D0D7DE" stroke-width="2"/>
<rect x="72" y="81" width="111" height="22" fill="#FFFFFF"/>
<text x="84" y="97" class="mu b" font-size="12" letter-spacing="2.5">YOUR MACHINE</text>
<rect x="76" y="122" width="344" height="74" rx="8" fill="#F6F8FA" stroke="#D0D7DE"/>
<text x="98" y="152" class="tx b" font-size="17">Your files</text>
<text x="98" y="176" class="dm" font-size="13">C:\  D:\  ~/ — everything you have</text>
<rect x="76" y="222" width="344" height="74" rx="8" fill="#F6F8FA" stroke="#D0D7DE"/>
<text x="98" y="252" class="tx b" font-size="17">Your session</text>
<text x="98" y="276" class="dm" font-size="13">browser logins, keys, ssh agent</text>
<rect x="76" y="322" width="344" height="74" rx="8" fill="#F6F8FA" stroke="#D0D7DE"/>
<rect x="76" y="322" width="4" height="74" rx="2" fill="#0969DA"/>
<text x="98" y="352" class="tx b" font-size="17">Your model server</text>
<text x="98" y="376" class="dm" font-size="13">Ollama · LM Studio · llama.cpp · vLLM</text>
<text x="98" y="424" class="bl" font-size="13">:11434 — bound to 0.0.0.0, by you</text>
<line x1="516" y1="72" x2="516" y2="496" stroke="#D0D7DE" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="564" y1="72" x2="564" y2="496" stroke="#D0D7DE" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="510" y="238" width="60" height="94" fill="#FFFFFF"/>
<text x="540" y="285" class="mu b" font-size="13" letter-spacing="2.5" text-anchor="middle" transform="rotate(-90 540 285)">WSL2 / DOCKER</text>
<rect x="632" y="92" width="600" height="384" rx="12" fill="none" stroke="#D0D7DE" stroke-width="2"/>
<rect x="656" y="81" width="75" height="22" fill="#FFFFFF"/>
<text x="668" y="97" class="mu b" font-size="12" letter-spacing="2.5">THE BOX</text>
<rect x="660" y="122" width="544" height="74" rx="8" fill="#F6F8FA" stroke="#D0D7DE"/>
<rect x="660" y="122" width="4" height="74" rx="2" fill="#0969DA"/>
<text x="682" y="152" class="tx b" font-size="17">root@infiny</text>
<text x="682" y="176" class="dm" font-size="13">Debian 13, systemd, apt — a real machine</text>
<rect x="660" y="222" width="264" height="74" rx="8" fill="#F6F8FA" stroke="#D0D7DE"/>
<text x="678" y="252" class="tx b" font-size="15">Hermes Agent</text>
<text x="678" y="275" class="dm" font-size="12">reasoning, tools, approvals</text>
<rect x="940" y="222" width="264" height="74" rx="8" fill="#F6F8FA" stroke="#D0D7DE"/>
<text x="958" y="252" class="tx b" font-size="15">SearXNG :8080</text>
<text x="958" y="275" class="dm" font-size="12">search, inside the Box</text>
<rect x="660" y="322" width="264" height="74" rx="8" fill="#F6F8FA" stroke="#D0D7DE"/>
<text x="678" y="352" class="tx b" font-size="15">Chromium</text>
<text x="678" y="375" class="dm" font-size="12">renders JS pages, inside</text>
<rect x="940" y="322" width="264" height="74" rx="8" fill="#F6F8FA" stroke="#D0D7DE"/>
<text x="958" y="352" class="tx b" font-size="15">yazi · rg · fd · fzf</text>
<text x="958" y="375" class="dm" font-size="12">the tooling you expect</text>
<text x="662" y="424" class="dm" font-size="13">host files mounted: none</text>
<line x1="628" y1="159" x2="592" y2="159" stroke="#CF222E" stroke-width="2" stroke-dasharray="5 5" opacity="0.85"/>
<line x1="452" y1="159" x2="500" y2="159" stroke="#CF222E" stroke-width="2" stroke-dasharray="5 5" opacity="0.85"/>
<circle cx="540" cy="159" r="13" fill="#FFFFFF" stroke="#CF222E" stroke-width="2"/>
<path d="M535 154 L545 164 M545 154 L535 164" stroke="#CF222E" stroke-width="2.2" stroke-linecap="round"/>
<text x="540" y="135" class="rd" font-size="12.5" text-anchor="middle">not mounted</text>
<line x1="628" y1="259" x2="592" y2="259" stroke="#CF222E" stroke-width="2" stroke-dasharray="5 5" opacity="0.85"/>
<line x1="452" y1="259" x2="500" y2="259" stroke="#CF222E" stroke-width="2" stroke-dasharray="5 5" opacity="0.85"/>
<circle cx="540" cy="259" r="13" fill="#FFFFFF" stroke="#CF222E" stroke-width="2"/>
<path d="M535 254 L545 264 M545 254 L535 264" stroke="#CF222E" stroke-width="2.2" stroke-linecap="round"/>
<text x="540" y="235" class="rd" font-size="12.5" text-anchor="middle">interop off</text>
<path d="M628 359 L456 359" stroke="#0969DA" stroke-width="2.5" marker-end="url(#a)"/>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#0969DA"/></marker></defs>
<text x="540" y="337" class="bl b" font-size="12.5" text-anchor="middle">the one crossing</text>
<line x1="48" y1="500" x2="1232" y2="500" stroke="#D0D7DE"/>
<text x="48" y="532" class="mu" font-size="15">Nothing of yours is reachable by default. Reaching further is a deliberate act — and the worst case is your files, not your session.</text>
</svg>
